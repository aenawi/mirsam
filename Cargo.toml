[workspace]
resolver = "3"
members = [
    "crates/mirsam-core",
    "crates/mirsam-ooxml",
    "crates/mirsam-html",
    "crates/mirsam-conformance",
    "crates/mirsam-fonts",
    "crates/mirsam-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Hashem Aldhaheri <ict@opentech.ae>"]
repository = "https://github.com/aenawi/mirsam"
homepage = "https://github.com/aenawi/mirsam"
keywords = ["arabic", "rtl", "bidi", "unicode", "ooxml"]
categories = ["command-line-utilities", "text-processing", "internationalization"]

[workspace.dependencies]
mirsam-core = { path = "crates/mirsam-core", version = "0.1.0" }
mirsam-ooxml = { path = "crates/mirsam-ooxml", version = "0.1.0" }
mirsam-html = { path = "crates/mirsam-html", version = "0.1.0" }
mirsam-fonts = { path = "crates/mirsam-fonts", version = "0.1.0" }
unicode-bidi = "0.3.18"
unicode-normalization = "0.1.25"
rustybuzz = "0.20"
# Pinned to what rustybuzz 0.20 resolves: two copies of a font parser in one
# binary would be two answers to "does this font have this glyph".
ttf-parser = "0.25"
quick-xml = "0.42"
# Tree construction only. The HTML adapter supplies its own `TreeSink` rather
# than taking `markup5ever_rcdom`, which names itself unsupported.
html5ever = "0.39"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
